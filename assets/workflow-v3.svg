<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="220" viewBox="0 0 1400 220" role="img" aria-label="需求、真实菜单、官方核价、预算比较四步流程"><rect width="1400" height="220" rx="20" fill="#f7f2e6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="35" y="35" width="295" height="148" rx="15" fill="#fffdf8" stroke="#e4d4b8"/><text x="56" y="72" fill="#b7975a" font-size="17">01</text><text x="56" y="111" fill="#30241c" font-size="25" font-weight="700">说出需求</text><text x="56" y="150" fill="#88725b" font-size="16">预算、门店、想吃什么</text><path d="M345 105h19l-5 -5m5 5l-5 5" fill="none" stroke="#b79658" stroke-width="2"/><rect x="380" y="35" width="295" height="148" rx="15" fill="#fffdf8" stroke="#e4d4b8"/><text x="401" y="72" fill="#b7975a" font-size="17">02</text><text x="401" y="111" fill="#30241c" font-size="25" font-weight="700">查真实菜单</text><text x="401" y="150" fill="#88725b" font-size="16">当前餐品、券与套餐选项</text><path d="M690 105h19l-5 -5m5 5l-5 5" fill="none" stroke="#b79658" stroke-width="2"/><rect x="725" y="35" width="295" height="148" rx="15" fill="#251b16" stroke="#e4d4b8"/><text x="746" y="72" fill="#b7975a" font-size="17">03</text><text x="746" y="111" fill="#ffce45" font-size="25" font-weight="700">官方核价</text><text x="746" y="150" fill="#d4bea0" font-size="16">calculate-price整单计价</text><path d="M1035 105h19l-5 -5m5 5l-5 5" fill="none" stroke="#b79658" stroke-width="2"/><rect x="1070" y="35" width="295" height="148" rx="15" fill="#fffdf8" stroke="#e4d4b8"/><text x="1091" y="72" fill="#b7975a" font-size="17">04</text><text x="1091" y="111" fill="#30241c" font-size="25" font-weight="700">比较餐单</text><text x="1091" y="150" fill="#88725b" font-size="16">份数、预算余量、优惠条件</text></g></svg>