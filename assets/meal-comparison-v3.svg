<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="610" viewBox="0 0 1400 610" role="img" aria-labelledby="t d"><title id="t">30元预算的三份真实历史核价餐单</title><desc id="d">2026年10月11日深圳南科大餐厅，人气经典随心配14.90元，大堡口福三件套22.90元，龙焰鸡腿堡三件套26.90元。</desc><rect width="1400" height="610" rx="24" fill="#f7f2e6"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><text x="54" y="65" fill="#89745e" font-size="18" letter-spacing="2">ONE REQUEST / THREE CHOICES</text><text x="54" y="118" fill="#291e18" font-size="36" font-weight="800">30元，想吃汉堡和饮料。</text><text x="54" y="157" fill="#796653" font-size="20">同一家门店，三份官方核价结果，预算余量直接比较。</text><rect x="54" y="198" width="410" height="314" rx="18" fill="#fffdf8" stroke="#e6d8bd"/><rect x="77" y="221" width="38" height="28" rx="8" fill="#ffce45"/><text x="87" y="241" fill="#4a3219" font-size="15" font-weight="700">01</text><text x="131" y="242" fill="#8e775d" font-size="16">汉堡 + 饮料</text><text x="77" y="289" fill="#291e18" font-size="24" font-weight="700">人气经典随心配</text><text x="77" y="326" fill="#705f4d" font-size="17">双层吉士汉堡</text><text x="77" y="355" fill="#705f4d" font-size="17">阳光柠檬红茶 · 中杯</text><path d="M77 378H440" stroke="#e4d8c3" stroke-dasharray="5 6"/><text x="77" y="443" fill="#24734e" font-size="54" font-weight="800">¥14.90</text><rect x="77" y="466" width="180" height="29" rx="14" fill="#eaf2df"/><text x="93" y="486" fill="#2e6546" font-size="17">预算剩余 ¥15.10</text><rect x="486" y="198" width="410" height="314" rx="18" fill="#fffdf8" stroke="#e6d8bd"/><rect x="509" y="221" width="38" height="28" rx="8" fill="#ffce45"/><text x="519" y="241" fill="#4a3219" font-size="15" font-weight="700">02</text><text x="563" y="242" fill="#8e775d" font-size="16">汉堡 + 薯条 + 饮料</text><text x="509" y="289" fill="#291e18" font-size="24" font-weight="700">大堡口福三件套</text><text x="509" y="326" fill="#705f4d" font-size="17">Hold不住鸡排堡（椒盐风味）</text><text x="509" y="355" fill="#705f4d" font-size="17">中薯条 + 可乐中杯</text><path d="M509 378H872" stroke="#e4d8c3" stroke-dasharray="5 6"/><text x="509" y="443" fill="#34231a" font-size="54" font-weight="800">¥22.90</text><rect x="509" y="466" width="180" height="29" rx="14" fill="#eaf2df"/><text x="525" y="486" fill="#2e6546" font-size="17">预算剩余 ¥7.10</text><rect x="918" y="198" width="410" height="314" rx="18" fill="#fffdf8" stroke="#e6d8bd"/><rect x="941" y="221" width="38" height="28" rx="8" fill="#ffce45"/><text x="951" y="241" fill="#4a3219" font-size="15" font-weight="700">03</text><text x="995" y="242" fill="#8e775d" font-size="16">汉堡 + 薯条 + 饮料</text><text x="941" y="289" fill="#291e18" font-size="24" font-weight="700">龙焰鸡腿堡三件套</text><text x="941" y="326" fill="#705f4d" font-size="17">龙焰鸡腿堡</text><text x="941" y="355" fill="#705f4d" font-size="17">中薯条 + 可乐中杯</text><path d="M941 378H1304" stroke="#e4d8c3" stroke-dasharray="5 6"/><text x="941" y="443" fill="#34231a" font-size="54" font-weight="800">¥26.90</text><rect x="941" y="466" width="180" height="29" rx="14" fill="#eaf2df"/><text x="957" y="486" fill="#2e6546" font-size="17">预算剩余 ¥3.10</text><text x="54" y="560" fill="#8a745f" font-size="18">历史快照 · 2026-10-11 · 深圳南科大餐厅 · 当次无可用券</text><text x="54" y="590" fill="#8a745f" font-size="17">金额来自该次官方核价，当前购买需重新查询；比较范围仅为这三份餐单。</text></g></svg>